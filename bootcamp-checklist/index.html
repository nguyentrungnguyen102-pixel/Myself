<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootcamp 30 Ngày — English + AI</title>
<style>
  :root{
    --bg:#f7f7f5; --panel:#ffffff; --border:#e9e9e7; --text:#37352f;
    --text-light:#8a8a86; --accent:#2383e2; --accent-light:#e7f3fe;
    --green:#2f9e44; --green-light:#ebfbee; --amber:#e8590c; --radius:8px;
    --shadow:0 1px 2px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;}
  a{color:var(--accent);}
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  #sidebar{width:260px;flex:0 0 260px;background:var(--panel);border-right:1px solid var(--border);
    padding:16px 8px;overflow-y:auto;height:100vh;position:sticky;top:0;}
  .brand{font-weight:700;font-size:15px;padding:6px 10px 14px;color:var(--text);}
  .brand small{display:block;font-weight:400;color:var(--text-light);font-size:11px;margin-top:2px;}
  .nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;
    color:var(--text);text-decoration:none;font-size:13.5px;}
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--accent-light);color:var(--accent);font-weight:600;}
  .nav-week{margin-top:10px;}
  .nav-week-head{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--text-light);text-transform:uppercase;cursor:pointer;}
  .nav-week-head .pct{font-weight:600;color:var(--text-light);}
  .nav-days{display:none;padding-left:6px;}
  .nav-days.open{display:block;}
  .nav-day{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px;}
  .nav-day:hover{background:var(--bg);}
  .nav-day.active{background:var(--accent-light);color:var(--accent);font-weight:600;}
  .nav-day .dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex:0 0 8px;}
  .nav-day.done .dot{background:var(--green);}
  .nav-day.today{font-weight:700;}
  .sidebar-divider{height:1px;background:var(--border);margin:12px 6px;}

  /* Main */
  #main{flex:1;min-width:0;padding:28px 36px 80px;max-width:960px;}
  h1{font-size:26px;margin:0 0 4px;}
  h2{font-size:19px;margin:28px 0 10px;}
  .subtitle{color:var(--text-light);margin-bottom:20px;font-size:13.5px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;
    margin-bottom:16px;box-shadow:var(--shadow);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .stat .num{font-size:26px;font-weight:700;}
  .stat .lbl{color:var(--text-light);font-size:12.5px;margin-top:2px;}
  .bar-track{background:var(--bg);border-radius:6px;height:8px;overflow:hidden;margin-top:8px;border:1px solid var(--border);}
  .bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .2s;}
  .bar-fill.green{background:var(--green);}

  .task-row{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:6px;}
  .task-row:hover{background:var(--bg);}
  .task-row input[type=checkbox]{width:18px;height:18px;margin-top:1px;accent-color:var(--green);cursor:pointer;flex:0 0 18px;}
  .task-body{flex:1;min-width:0;}
  .task-row label{cursor:pointer;line-height:1.4;}
  .task-row.done label{color:var(--text-light);text-decoration:line-through;}
  .task-cat{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:6px;
    text-transform:uppercase;vertical-align:1px;}
  .task-cat.ai{background:#f3e8ff;color:#7048e8;}
  .task-cat.english{background:var(--accent-light);color:var(--accent);}
  .task-cat.track{background:#fff3bf;color:#997404;}

  .block{margin-bottom:14px;}
  .block .tag{font-size:11px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .block .txt{white-space:pre-wrap;}

  .prompt-btn{display:inline-block;font-size:12px;background:var(--accent-light);color:var(--accent);
    border:none;border-radius:5px;padding:3px 9px;cursor:pointer;margin-top:6px;}
  .prompt-box{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-top:8px;
    font-size:13px;white-space:pre-wrap;display:none;position:relative;}
  .prompt-box.open{display:block;}
  .copy-btn{position:absolute;top:8px;right:8px;font-size:11px;background:var(--panel);border:1px solid var(--border);
    border-radius:5px;padding:3px 8px;cursor:pointer;}

  .kpi-box{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0;}
  .kpi-box .kb{flex:1;min-width:220px;background:var(--green-light);border:1px solid #b2f2bb;border-radius:6px;padding:10px 12px;font-size:13px;}
  .kpi-box .kb.deliv{background:#fff9db;border-color:#ffe066;}
  .kpi-box .kb b{display:block;font-size:11px;text-transform:uppercase;color:var(--text-light);margin-bottom:3px;}

  .day-nav-footer{display:flex;justify-content:space-between;margin-top:24px;}
  button.pill{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:7px 16px;cursor:pointer;font-size:13px;}
  button.pill:hover{background:var(--bg);}
  button.primary{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-size:13.5px;}
  button.primary:hover{opacity:.9;}
  button.danger{background:#fff5f5;color:#c92a2a;border:1px solid #ffc9c9;border-radius:6px;padding:4px 9px;font-size:11.5px;cursor:pointer;}

  .attach-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .attach-item{width:100px;position:relative;}
  .attach-item img{width:100px;height:100px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}
  .attach-item .file-chip{width:100px;height:100px;border-radius:6px;border:1px solid var(--border);background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;padding:6px;word-break:break-all;}
  .attach-item .rm{position:absolute;top:-6px;right:-6px;background:#c92a2a;color:#fff;border:none;border-radius:50%;
    width:18px;height:18px;font-size:11px;cursor:pointer;line-height:1;}
  .attach-item .fname{font-size:10px;color:var(--text-light);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .upload-label{display:inline-block;margin-top:10px;font-size:12.5px;background:var(--bg);border:1px dashed var(--border);
    border-radius:6px;padding:7px 12px;cursor:pointer;color:var(--text-light);}
  .upload-label input{display:none;}
  .attach-audio{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;
    padding:6px 8px;margin-top:8px;max-width:100%;}
  .attach-audio audio{height:32px;max-width:220px;}
  .attach-audio .fname{font-size:11px;color:var(--text-light);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .attach-audio .rm{background:#fff5f5;color:#c92a2a;border:1px solid #ffc9c9;border-radius:5px;width:auto;height:auto;
    padding:2px 7px;font-size:11px;position:static;line-height:1.4;}

  .task-hint{font-size:12px;color:var(--text-light);margin-top:3px;line-height:1.4;}
  .task-toggle{display:inline-block;font-size:11.5px;background:none;border:none;color:var(--accent);cursor:pointer;
    padding:4px 0;margin-top:2px;}
  .task-panel{display:none;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-top:6px;}
  .task-panel.open{display:block;}
  .task-panel textarea{min-height:60px;}
  .task-panel .upload-label{margin-top:8px;padding:5px 10px;font-size:12px;}

  table.simple{width:100%;border-collapse:collapse;margin-top:8px;}
  table.simple th,table.simple td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);font-size:13px;}
  select,input[type=text],input[type=date],textarea{font-family:inherit;font-size:13px;padding:6px 8px;
    border:1px solid var(--border);border-radius:5px;background:#fff;color:var(--text);width:100%;}
  textarea{resize:vertical;min-height:50px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11.5px;color:var(--text-light);text-transform:uppercase;margin-bottom:4px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;}
  .badge.todo{background:#f1f3f5;color:#495057;}
  .badge.progress{background:#fff3bf;color:#997404;}
  .badge.done{background:var(--green-light);color:var(--green);}
  .next-item{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid var(--border);font-size:13.5px;}
  .next-item:last-child{border-bottom:none;}
  .next-item a{font-size:12px;}
  .empty-hint{color:var(--text-light);font-size:13px;}
  #onboard-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;}
  #onboard-card{background:#fff;border-radius:10px;padding:28px 30px;max-width:420px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.2);}
  #onboard-card h2{margin-top:0;}
  .toast{position:fixed;bottom:20px;right:20px;background:#212529;color:#fff;padding:10px 16px;border-radius:6px;
    font-size:13px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:100;}
  .toast.show{opacity:1;transform:translateY(0);}
  @media(max-width:800px){
    #app{flex-direction:column;}
    #sidebar{width:100%;height:auto;position:relative;flex:none;border-right:none;border-bottom:1px solid var(--border);}
    #main{padding:20px 16px 60px;}
  }
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>
<div id="onboard-overlay" style="display:none">
  <div id="onboard-card">
    <h2>Bắt đầu Bootcamp</h2>
    <p style="color:var(--text-light);font-size:13.5px;">Chọn ngày Ngày&nbsp;1 của kế hoạch (mặc định hôm nay). App sẽ tự tính bạn đang ở Ngày mấy mỗi khi mở lên.</p>
    <div class="field"><label>Ngày bắt đầu (Ngày 1)</label><input type="date" id="onboard-date"></div>
    <button class="primary" id="onboard-confirm" style="width:100%;">Xác nhận & bắt đầu</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============================= DATA ============================= */

var DEFAULT_START_DATE = "2026-07-01";

var PROMPTS = {
  A1:{group:"Speaking", title:"A1 — Self-intro coach", text:"You are a business English speaking coach. I'm a BD professional in fintech/payments preparing for international roles. Ask me to introduce myself in 90 seconds. After I speak, give: (1) 3 pronunciation/grammar fixes, (2) a tighter rewritten version, (3) make me repeat it. Keep feedback under 120 words. Speak slowly."},
  A2:{group:"Speaking", title:"A2 — Small talk drill", text:"Role-play small talk before a business meeting. You're a foreign partner. Keep it natural, 4–5 exchanges. If I freeze or use Vietnamese sentence structure, gently correct and continue. At the end, list 5 useful phrases I missed."},
  A3:{group:"Speaking", title:"A3 — Mock meeting 30'", text:"Simulate a 30-minute online business meeting. You are the client's project lead. Agenda: I give a status update, you ask 3 tough questions about timeline and requirements, we agree next steps. Interrupt me realistically. After, score me /10 on clarity, fluency, professional tone, and give the 3 biggest fixes."},

  A6:{group:"Speaking", title:"A6 — Mock interview BD", text:"Act as a hiring manager interviewing me for a Senior Business Development role at an international fintech. Ask 8 questions mixing behavioral (STAR) and domain (payments, key-account, pipeline). One at a time. Push back on weak answers. At the end: overall /10, specific fixes, and rewrite my 2 weakest answers. Be tough but fair."},

  B2:{group:"AI", title:"B2 — Project 1 architect (lead-gen)", text:"Design a no-code/low-code lead-gen + outreach workflow for a fintech BD. Inputs: company list. Outputs: enriched profile + personalized outreach. Use n8n + an LLM. Give me the node-by-node build and the exact prompts each step needs."},
  B3:{group:"AI", title:"B3 — Project 2 (proposal/RFP)", text:"Build a proposal generator: input = client brief + our capability doc, output = structured proposal. Give the system prompt, the template sections, and how to keep it factual (no hallucinated claims)."},
  B4:{group:"AI", title:"B4 — Project 3 (data dashboard)", text:"I have a CSV of [transactions/pricing]. Give me a Python + HTML dashboard plan (charts, filters, auto-insights) I can deploy on Netlify. Then write the code file by file."},
  B5:{group:"AI", title:"B5 — Portfolio writer", text:"Turn this project into a portfolio entry: problem → approach → result, in the voice of a BD person selling their AI skills to a hiring manager. Under 120 words. [paste notes]"},

  C3:{group:"AI", title:"C3 — ROI/TCO case study builder", text:"Help me build an ROI/TCO business case for an AI solution I'd sell to [merchant/company — describe their business]. Walk me through: (1) current cost/inefficiency baseline, (2) total cost of ownership of the AI solution (build + run), (3) expected ROI and payback period, (4) the 3 assumptions a CFO would challenge first. Keep numbers realistic and show the formulas."},
  C4:{group:"AI", title:"C4 — Architecture note writer", text:"I'll describe a project I built (paste notes below). Write a 1-page architecture note in English for a technical/business hybrid reader: (1) problem, (2) architecture in words, (3) key components and why I chose them, (4) trade-offs I made, (5) what I'd improve with more time. Under 400 words, confident but honest tone. Notes: [___]"}

  {skill:"RAG", standard:"Chatbot đọc PDF 50–100 trang (tài liệu thầu/năng lực thật)", test:"≥80% đúng trên 20 câu hỏi test", deadline:"Ngày 23"},

function getHint(t){
  for(var i=0;i<HINT_RULES.length;i++){ if(HINT_RULES[i][0].test(t.id)) return HINT_RULES[i][1]; }
  if(t.cat==="english") return "Luyện qua voice mode của ChatGPT/Claude/Gemini, hoặc app Speak/Langua/Talkio.";
  if(t.cat==="ai") return "Học trên Coursera/LinkedIn Learning, hoặc thực hành trực tiếp với ChatGPT/Claude.";
  return "Ghi chú/tự đánh giá ngắn gọn ở đây.";
}

function mkDay(num, theme, morning, english, milestone, tasks){
  return {
    num:num,
    week: Math.min(4, Math.ceil(num/7)),
    theme:theme,
    morning:morning, english:english,
    milestone:milestone,
    tasks:tasks
  };
}
function blockHours(day){
  return {morning:"Sáng (3h)", english:"Trưa + Tối (3h)"};
}
function realDateForDay(num){
  var start = new Date((state.startDate||DEFAULT_START_DATE)+"T00:00:00");
  start.setDate(start.getDate() + (num-1));
  return start;
}
function dateForDay(num){
  var d = realDateForDay(num);
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
}
function weekdayForDay(num){
  var d = realDateForDay(num).getDay(); // 0=CN,1=T2,...6=T7
  return WEEKDAY_CYCLE_REAL[d];
}

var TOTAL_DAYS = PLAN.length;

/* ============================= STORAGE ============================= */

var LS_KEY = "bootcamp30_state_v1";

function defaultState(){
  return { version:1, startDate:DEFAULT_START_DATE, days:{}, certs:{}, projects:{} };
}

var state = loadState();

function loadState(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}

function saveState(skipPush){
  state.updatedAt = Date.now();
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  if(!skipPush) scheduleSyncPush();
}

/* ---- Multi-device sync (Netlify Function + Blobs) ---- */
var SYNC_PIN_KEY = "bootcamp30_sync_pin";
var SYNC_ENDPOINT = "/.netlify/functions/state";

function getSyncPin(){ return localStorage.getItem(SYNC_PIN_KEY) || ""; }
function setSyncPin(pin){ localStorage.setItem(SYNC_PIN_KEY, pin); }

function setSyncStatus(msg){
  var el = document.getElementById("sync-status");
  if(el) el.textContent = msg;
}

function syncPayload(){
  return {
    version: state.version, startDate: state.startDate,
    days: state.days, certs: state.certs, projects: state.projects,
    updatedAt: state.updatedAt || 0
  };
}

function pushSync(){
  var pin = getSyncPin();
  if(!pin) return Promise.resolve();
  return fetch(SYNC_ENDPOINT+"?pin="+encodeURIComponent(pin), {
    method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(syncPayload())
  }).then(function(r){
    if(!r.ok) throw new Error("push failed");
    setSyncStatus("Đã đồng bộ lúc "+new Date().toLocaleTimeString());
  }).catch(function(){ setSyncStatus("Đồng bộ thất bại — kiểm tra mạng."); });
}

var pushTimer = null;
function scheduleSyncPush(){
  if(!getSyncPin()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushSync, 2000);
}

function pullSync(auto){
  var pin = getSyncPin();
  if(!pin) return Promise.resolve();
  return fetch(SYNC_ENDPOINT+"?pin="+encodeURIComponent(pin))
    .then(function(r){ if(!r.ok) throw new Error("pull failed"); return r.json(); })
    .then(function(remote){
      if(!remote){
        if(!auto) setSyncStatus("Chưa có dữ liệu đồng bộ cho PIN này — sẽ tạo mới.");
        return;
      }
      var remoteTs = remote.updatedAt || 0;
      var localTs = state.updatedAt || 0;
      if(remoteTs > localTs){
        state = Object.assign(defaultState(), remote);
        saveState(true);
        setSyncStatus("Đã tải bản mới hơn từ thiết bị khác lúc "+new Date().toLocaleTimeString());
        render();
      } else if(!auto){
        setSyncStatus("Dữ liệu hiện tại đã là bản mới nhất.");
      }
    }).catch(function(){ if(!auto) setSyncStatus("Không tải được dữ liệu đồng bộ — kiểm tra mạng."); });
}

function getDayState(num){
  var k = String(num);
  if(!state.days[k]) state.days[k] = { tasks:{}, note:"", notes:{} };
  if(!state.days[k].notes) state.days[k].notes = {};
  return state.days[k];
}

function getCertState(id){

}

function getProjectState(id){
  if(!state.projects[id]) state.projects[id] = { status:"todo", link:"", note:"" };
  return state.projects[id];
}

/* ---- IndexedDB for attachments (images/files) ---- */
var DB_NAME = "bootcamp30_db", DB_STORE = "attachments";
var dbPromise = null;
function idbOpen(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise(function(resolve,reject){
    var req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = function(){
      var db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        db.createObjectStore(DB_STORE, {keyPath:"id"});
      }
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return dbPromise;
}
function idbPut(record){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(DB_STORE,"readwrite");
      tx.objectStore(DB_STORE).put(record);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbDelete(id){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(DB_STORE,"readwrite");
      tx.objectStore(DB_STORE).delete(id);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function idbGetAll(){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(DB_STORE,"readonly");
      var req = tx.objectStore(DB_STORE).getAll();
      req.onsuccess = function(){ resolve(req.result || []); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function idbClear(){
  return idbOpen().then(function(db){
    return new Promise(function(resolve,reject){
      var tx = db.transaction(DB_STORE,"readwrite");
      tx.objectStore(DB_STORE).clear();
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}

var attachmentsCache = [];
function refreshAttachments(){
  return idbGetAll().then(function(list){ attachmentsCache = list; return list; });
}
function attachmentsFor(ownerType, ownerId){
  return attachmentsCache.filter(function(a){ return a.ownerType===ownerType && String(a.ownerId)===String(ownerId); });
}

/* ============================= HELPERS ============================= */

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtDate(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function todayISO(){ return fmtDate(new Date()); }

function currentPlanDay(){
  if(!state.startDate) return 1;
  var start = new Date(state.startDate+"T00:00:00");
  var now = new Date(todayISO()+"T00:00:00");
  var diff = Math.round((now-start)/86400000)+1;
  if(diff<1) diff=1;
  if(diff>TOTAL_DAYS) diff=TOTAL_DAYS;
  return diff;
}

function dayTaskCount(day){ return day.tasks.length; }
function dayDoneCount(day){
  var ds = getDayState(day.num);
  var n=0;
  day.tasks.forEach(function(t){ if(ds.tasks[t.id]) n++; });
  return n;
}
function dayComplete(day){ return dayDoneCount(day) === dayTaskCount(day); }

function overallStats(){
  var total=0, done=0;
  var byCat = {ai:{total:0,done:0}, english:{total:0,done:0}, track:{total:0,done:0}};
  PLAN.forEach(function(day){
    var ds = getDayState(day.num);
    day.tasks.forEach(function(t){
      total++; byCat[t.cat].total++;
      if(ds.tasks[t.id]){ done++; byCat[t.cat].done++; }
    });
  });
  return {total:total, done:done, pct: total? Math.round(done/total*100):0, byCat:byCat};
}

function weekStats(week){
  var total=0, done=0;
  PLAN.filter(function(d){return d.week===week;}).forEach(function(day){
    var ds = getDayState(day.num);
    day.tasks.forEach(function(t){ total++; if(ds.tasks[t.id]) done++; });
  });
  return {total:total, done:done, pct: total? Math.round(done/total*100):0};
}

function computeStreak(){
  var cur = currentPlanDay();
  var startFrom = dayComplete(PLAN[cur-1]) ? cur : cur-1;
  var streak = 0;
  for(var i=startFrom; i>=1; i--){
    if(dayComplete(PLAN[i-1])) streak++; else break;
  }
  return streak;
}

function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

  var items = attachmentsFor("day", dayNum);
  grid.innerHTML = items.map(attachmentHtml).join("") || '';
  bindAttachmentRemovers(grid);
  document.querySelectorAll('[data-inline-prompt]').forEach(function(btn){
    btn.addEventListener("click", function(){
      var pid = this.getAttribute("data-inline-prompt");
      var p = PROMPTS[pid];
      var existing = this.parentElement.querySelector(".prompt-box");
      if(existing){ existing.classList.toggle("open"); return; }
      var box = document.createElement("div");
      box.className = "prompt-box open";
      box.innerHTML = '<button class="copy-btn">Copy</button><b>'+esc(p.title)+'</b><br><br>'+esc(p.text);
      this.parentElement.appendChild(box);
      box.querySelector(".copy-btn").addEventListener("click", function(){ copyText(p.text); });
    });
  });
}

function attachmentHtml(a){
  if(a.mime && a.mime.indexOf("audio/")===0){
    return '<div class="attach-audio" data-att="'+a.id+'">'+
      '<audio controls src="'+a.dataUrl+'"></audio>'+
      '<span class="fname" title="'+esc(a.name)+'">'+esc(a.name)+'</span>'+
      '<button class="rm" data-rm="'+a.id+'">Xoá</button></div>';
  }
  var isImg = a.mime && a.mime.indexOf("image/")===0;
  return '<div class="attach-item" data-att="'+a.id+'">'+
    (isImg? '<img src="'+a.dataUrl+'">' : '<div class="file-chip">📄<br>'+esc(a.name)+'</div>')+
    '<button class="rm" data-rm="'+a.id+'">×</button>'+
    '<div class="fname" title="'+esc(a.name)+'">'+esc(a.name)+'</div></div>';
}
function renderTaskAttachments(dayNum, taskId){
  var grid = document.getElementById("task-attach-"+dayNum+"_"+taskId);
  if(!grid) return;
  var items = attachmentsFor("task", dayNum+"_"+taskId);
  grid.innerHTML = items.map(attachmentHtml).join("") || '';
  bindAttachmentRemovers(grid);

function bindAttachmentRemovers(container){
  container.querySelectorAll("[data-rm]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var id = this.getAttribute("data-rm");
      idbDelete(id).then(refreshAttachments).then(function(){
        render();
        toast("Đã xoá minh chứng");
      });
    });
  });
}

function handleUpload(fileList, ownerType, ownerId, cb){
  var files = Array.prototype.slice.call(fileList);
  var promises = files.map(function(file){
    return new Promise(function(resolve){
      var reader = new FileReader();
      reader.onload = function(){
        resolve({
          id: ownerType+"-"+ownerId+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),
          ownerType: ownerType, ownerId: String(ownerId),
          name: file.name, mime: file.type, dataUrl: reader.result, ts: Date.now()
        });
      };
      reader.readAsDataURL(file);
    });
  });
  Promise.all(promises).then(function(records){
    return Promise.all(records.map(idbPut));
  }).then(refreshAttachments).then(function(){
    toast("Đã thêm "+files.length+" minh chứng");
    if(cb) cb();
  });
}

function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("Đã copy prompt"); }, function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Đã copy prompt"); }catch(e){}
  document.body.removeChild(ta);
}

function certOrProjectCard(kind, id, title, desc, s){
  var badgeClass = s.status==="done"?"done":s.status==="progress"?"progress":"todo";
  var badgeText = s.status==="done"?"Hoàn thành":s.status==="progress"?"Đang làm":"Chưa bắt đầu";
  var atts = attachmentsFor(kind, id);
  return '<div class="card" data-kind="'+kind+'" data-id="'+id+'">'+
    '<div class="flex-between"><b>'+esc(title)+'</b><span class="badge '+badgeClass+'">'+badgeText+'</span></div>'+
    '<div style="color:var(--text-light);margin:6px 0 10px;font-size:13px;">'+esc(desc)+'</div>'+
    '<div class="field"><label>Trạng thái</label><select data-field="status">'+
      ['todo','progress','done'].map(function(v){
        return '<option value="'+v+'"'+(s.status===v?" selected":"")+'>'+(v==="todo"?"Chưa bắt đầu":v==="progress"?"Đang làm":"Hoàn thành")+'</option>';
      }).join("")+'</select></div>'+
    '<div class="field"><label>Link (credential / demo)</label><input type="text" data-field="link" value="'+esc(s.link)+'" placeholder="https://..."></div>'+
    '<div class="field"><label>Ghi chú</label><textarea data-field="note" placeholder="Ghi chú...">'+esc(s.note)+'</textarea></div>'+
    '<label class="upload-label">+ Thêm ảnh/file minh chứng<input type="file" class="tracker-upload" accept="image/*,.pdf" multiple></label>'+
    '<div class="attach-grid">'+atts.map(attachmentHtml).join("")+'</div>'+
  '</div>';
}

function bindTrackerCards(kind, items){
  document.querySelectorAll('.card[data-kind="'+kind+'"]').forEach(function(card){
    var id = card.getAttribute("data-id");
    var getter = kind==="cert" ? getCertState : getProjectState;
    card.querySelectorAll("[data-field]").forEach(function(el){
      el.addEventListener("change", function(){
        var s = getter(id);
        s[this.getAttribute("data-field")] = this.value;
        saveState();
        if(this.getAttribute("data-field")==="status") render();
      });
      if(el.tagName==="TEXTAREA"){
        el.addEventListener("keyup", function(){
          getter(id)[this.getAttribute("data-field")] = this.value;
          saveState();
        });
      }
    });
    var up = card.querySelector(".tracker-upload");
    up.addEventListener("change", function(e){
      handleUpload(e.target.files, kind, id, render);
    });
    bindAttachmentRemovers(card);
  });
}

function renderSettings(){
  var html = '<h1>Cài đặt / Backup</h1>';

    '<div class="field"><label>Ngày 1 của kế hoạch</label><input type="date" id="settings-date" value="'+(state.startDate||DEFAULT_START_DATE)+'"></div>'+
    '<button class="primary" id="settings-save-date">Lưu</button></div>';

  html += '<div class="card"><h2 style="margin-top:0;">Đồng bộ đa thiết bị</h2>'+
    '<p style="color:var(--text-light);font-size:13px;">Nhập cùng 1 mã PIN trên mọi thiết bị (MacBook, tablet, điện thoại) để tự động đồng bộ checklist/ghi chú/trạng thái Cert & Project qua Netlify. '+
    '<b>Lưu ý:</b> đây không phải mật khẩu bảo mật — ai biết đúng PIN đều đọc/ghi được, nên đặt PIN dài/khó đoán, đừng dùng "1234". Ảnh/audio minh chứng chưa đồng bộ được (dùng Export/Import JSON ở dưới nếu cần chuyển ảnh).</p>'+
    '<div class="field"><label>Mã PIN đồng bộ</label><input type="text" id="sync-pin" value="'+esc(getSyncPin())+'" placeholder="VD: nguyen-bootcamp-2026"></div>'+
    '<button class="primary" id="sync-save-btn">Lưu PIN & đồng bộ ngay</button> '+
    '<span class="empty-hint" id="sync-status" style="margin-left:8px;"></span></div>';

  html += '<div class="card"><h2 style="margin-top:0;">Backup dữ liệu</h2>'+
    '<p style="color:var(--text-light);font-size:13px;">Dữ liệu chỉ lưu trong trình duyệt này. Export định kỳ để không mất tiến độ khi đổi máy / xoá cache.</p>'+
    '<button class="pill" id="export-btn">⬇ Export JSON</button> '+
    '<label class="pill" style="cursor:pointer;">⬆ Import JSON<input type="file" id="import-input" accept="application/json" style="display:none;"></label>'+
    '</div>';

  html += '<div class="card"><h2 style="margin-top:0;">Reset</h2>'+
    '<p style="color:var(--text-light);font-size:13px;">Xoá toàn bộ tiến độ và minh chứng đã lưu trên trình duyệt này. Không thể hoàn tác — hãy Export trước khi Reset.</p>'+
    '<button class="danger" id="reset-btn" style="padding:8px 16px;font-size:13px;">Xoá toàn bộ dữ liệu</button></div>';

  document.getElementById("main").innerHTML = html;

  document.getElementById("settings-save-date").addEventListener("click", function(){
    state.startDate = document.getElementById("settings-date").value || todayISO();
    saveState();
    toast("Đã lưu ngày bắt đầu");
    render();
  });
  document.getElementById("sync-save-btn").addEventListener("click", function(){
    var pin = document.getElementById("sync-pin").value.trim();
    setSyncPin(pin);
    if(!pin){ setSyncStatus("Đã bỏ đồng bộ (PIN trống)."); return; }
    setSyncStatus("Đang đồng bộ...");
    pullSync(false).then(function(){ return pushSync(); });
  });
  document.getElementById("export-btn").addEventListener("click", exportData);
  document.getElementById("import-input").addEventListener("change", function(e){
    if(e.target.files[0]) importData(e.target.files[0]);
  });
  document.getElementById("reset-btn").addEventListener("click", function(){
    if(confirm("Xoá toàn bộ dữ liệu đã lưu (checklist + minh chứng)? Hành động này không thể hoàn tác.")){
      localStorage.removeItem(LS_KEY);
      idbClear().then(function(){
        state = defaultState();
        refreshAttachments().then(function(){
          toast("Đã xoá toàn bộ dữ liệu");
          showOnboardIfNeeded();
          render();
        });
      });
    }
  });
}

function exportData(){
  refreshAttachments().then(function(atts){
    var payload = { state: state, attachments: atts, exportedAt: new Date().toISOString() };
    var blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "bootcamp30-backup-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("Đã export backup");
  });
}
function importData(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var payload = JSON.parse(reader.result);
      if(!payload.state) throw new Error("invalid");
      state = Object.assign(defaultState(), payload.state);
      saveState();
      idbClear().then(function(){
        var atts = payload.attachments || [];
        return Promise.all(atts.map(idbPut));
      }).then(refreshAttachments).then(function(){
        toast("Đã import backup thành công");
        render();
      });
    }catch(e){
      alert("File backup không hợp lệ.");
    }
  };
  reader.readAsText(file);
}

/* ============================= ONBOARD ============================= */

function showOnboardIfNeeded(){
  var overlay = document.getElementById("onboard-overlay");
  if(!state.startDate){
    overlay.style.display = "flex";
    document.getElementById("onboard-date").value = DEFAULT_START_DATE;
  } else {
    overlay.style.display = "none";
  }
}
document.getElementById("onboard-confirm").addEventListener("click", function(){
  state.startDate = document.getElementById("onboard-date").value || DEFAULT_START_DATE;
  saveState();
  document.getElementById("onboard-overlay").style.display = "none";
  render();
});

/* ============================= MAIN RENDER ============================= */

function render(){
  renderSidebar();
  var route = currentRoute();
  if(route.view==="day") renderDay(route.num);
  else if(route.view==="skillmatrix") renderSkillMatrix();
  else if(route.view==="prompts") renderPrompts();
  else if(route.view==="certs") renderCerts();
  else if(route.view==="projects") renderProjects();
  else if(route.view==="settings") renderSettings();
  else renderDashboard();
}

refreshAttachments().then(function(){
  return pullSync(true);
}).then(function(){
  showOnboardIfNeeded();
  render();
});

})();
</script>
